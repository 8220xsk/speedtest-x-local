<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no" />
<title>speedtest-x</title>
<link rel="shortcut icon" href="favicon.ico">
<script type="text/javascript" src="speedtest.js"></script>
<script type="text/javascript">
// INITIALIZE SPEEDTEST
var s = new Speedtest();
var xhr = new XMLHttpRequest();
var url_report = './backend/report.php';
var milestone = 0;
var key_prefix = Date.parse(new Date());

// 增加全局变量保存解析后的地理位置
var ipGeoData = {
    ip: '',
    country: '',
    region: '',
    city: '',
    area: '',
    isp: ''
};

// 页面加载时自动请求 backend/getIP.php 获取中文 IPDB 信息
function fetchIPInfo() {
    var getIpXhr = new XMLHttpRequest();
    getIpXhr.open('GET', './backend/getIP.php', true);
    getIpXhr.onload = function() {
        if (getIpXhr.status === 200) {
            try {
                var res = JSON.parse(getIpXhr.responseText);
                if (res.rawIspInfo) {
                    ipGeoData.country = res.rawIspInfo.country || '';
                    ipGeoData.region = res.rawIspInfo.region || '';
                    ipGeoData.city = res.rawIspInfo.city || '';
                    ipGeoData.area = res.rawIspInfo.area || '';
                    ipGeoData.isp = res.rawIspInfo.isp || '';
                }
            } catch (e) {
                console.error("IP解析异常", e);
            }
        }
    };
    getIpXhr.send();
}
fetchIPInfo();

s.onupdate = function(data) {
    I("ip").textContent = data.clientIp || "获取失败";
    I("dlText").textContent = (data.testState == 1 && data.dlStatus == 0) ? "..." : data.dlStatus;
    I("ulText").textContent = (data.testState == 3 && data.ulStatus == 0) ? "..." : data.ulStatus;
    I("pingText").textContent = data.pingStatus;
    I("jitText").textContent = data.jitterStatus;
    
    var prog = (Number(data.dlProgress) * 2 + Number(data.ulProgress) * 2 + Number(data.pingProgress)) / 5;
    I("progress").style.width = (100 * prog) + "%";

    var rawIpInfo = I("ip").textContent;
    var ip = '';
    var isp = '';
    var country = '';
    var region = '';
    var city = '';
    var area = '';

    if (rawIpInfo.includes(' - ')) {
        var parts = rawIpInfo.split(' - ');
        ip = parts[0].trim();
        var geoString = parts[1].trim();

        // 拆分类似 China Guangdong Shenzhen China Mobile 的位置字符串
        var geoParts = geoString.split(' ');
        if (geoParts.length >= 4) {
            country = geoParts[0];
            region  = geoParts[1];
            city    = geoParts[2];
            isp     = geoParts.slice(3).join(' ');
        } else if (geoParts.length === 3) {
            country = geoParts[0];
            region  = geoParts[1];
            isp     = geoParts[2];
        } else {
            isp = geoString;
        }
    } else {
        ip = rawIpInfo;
    }

    I("ipLine1").innerHTML = "IP地址: <span id=\"ip\">" + ip + "</span>";
    I("ipLine2").innerHTML = "<strong>国家:</strong> " + (country || '-') + 
                             " <strong>省份:</strong> " + (region || '-') + 
                             " <strong>城市:</strong> " + (city || '-') + 
                             " <strong>区域:</strong> " + (area || '-') + 
                             " <strong>运营商:</strong> " + (isp || '-');

    var progress = Math.floor(100 * prog);
    var key = key_prefix + "_" + ip;

    if (progress > 20 && (progress % 10 == 0) && progress != milestone) {
        var addr = [country, region, city, area].filter(Boolean).join(' ');
        var params = 'key=' + key + 
                     '&ip=' + encodeURIComponent(ip) + 
                     '&isp=' + encodeURIComponent(isp) + 
                     '&addr=' + encodeURIComponent(addr) + 
                     '&dspeed=' + I("dlText").textContent + 
                     '&uspeed=' + I("ulText").textContent + 
                     '&ping=' + I("pingText").textContent + 
                     '&jitter=' + I("jitText").textContent;

        xhr.timeout = 3000;
        xhr.open('POST', url_report, true);
        xhr.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
        xhr.send(params);
        milestone = progress;
    }
}

s.onend = function(aborted) {
    I("startStopBtn").className = "";
    if (aborted) {
        initUI();
    }
}

function startStop() {
    if (s.getState() == 3) {
        s.abort();
    } else {
        s.start();
        I("startStopBtn").className = "running";
    }
}

function initUI() {
    I("dlText").textContent = "";
    I("ulText").textContent = "";
    I("pingText").textContent = "";
    I("jitText").textContent = "";
}

function I(id) { return document.getElementById(id); }
</script>

<style type="text/css">
	html,body{
		border:none; padding:0; margin:0;
		background:#FFFFFF;
		color:#202020;
	}
	body{
		text-align:center;
		font-family:"Roboto",sans-serif;
	}
	h1{
		color:#404040;
	}
	#startStopBtn{
		display:inline-block;
		margin:0 auto;
		color:#6060AA;
		background-color:rgba(0,0,0,0);
		border:0.15em solid #6060FF;
		border-radius:0.3em;
		transition:all 0.3s;
		box-sizing:border-box;
		width:8em; height:3em;
		line-height:2.7em;
		cursor:pointer;
		box-shadow: 0 0 0 rgba(0,0,0,0.1), inset 0 0 0 rgba(0,0,0,0.1);
	}
	#startStopBtn:hover{
		box-shadow: 0 0 2em rgba(0,0,0,0.1), inset 0 0 1em rgba(0,0,0,0.1);
	}
	#startStopBtn.running{
		background-color:#FF3030;
		border-color:#FF6060;
		color:#FFFFFF;
	}
	#startStopBtn:before{
		content:"Start";
	}
	#startStopBtn.running:before{
		content:"Abort";
	}
	#test{
		margin-top:2em;
		margin-bottom:12em;
	}
	div.testArea{
		display:inline-block;
		width:14em;
		height:9em;
		position:relative;
		box-sizing:border-box;
	}
	div.testName{
		position:absolute;
		top:0.1em; left:0;
		width:100%;
		font-size:1.4em;
		z-index:9;
	}
	div.meterText{
		position:absolute;
		bottom:1.5em; left:0;
		width:100%;
		font-size:2.5em;
		z-index:9;
	}
	#dlText{
		color:#6060AA;
	}
	#ulText{
		color:#309030;
	}
	#pingText,#jitText{
		color:#AA6060;
	}
	div.meterText:empty:before{
		color:#505050 !important;
		content:"0.00";
	}
	div.unit{
		position:absolute;
		bottom:2em; left:0;
		width:100%;
		z-index:9;
	}
	div.testGroup{
		display:inline-block;
	}
	@media all and (max-width:65em){
		body{
			font-size:1.5vw;
		}
	}
	@media all and (max-width:40em){
		body{
			font-size:0.8em;
		}
		div.testGroup{
			display:block;
			margin: 0 auto;
		}
	}
	#progressBar{
		width:90%;
		height:0.3em;
		background-color:#EEEEEE;
		position:relative;
		display:block;
		margin:0 auto;
		margin-bottom:2em;
	}
	#progress{
		position:absolute;
		top:0; left:0;
		height:100%;
		width:0%;
		transition: width 2s;
		background-color:#90BBFF;
	}

	@media (prefers-color-scheme: dark) {
        html, body {
            background: #181818;
            color: #E0E0E0;
        }
        h1 {
            color: #FFFFFF;
        }
        #startStopBtn {
            color: #AAAAFF;
            border-color: #AAAAFF;
        }
        #startStopBtn:hover {
            box-shadow: 0 0 2em rgba(255, 255, 255, 0.1), inset 0 0 1em rgba(255, 255, 255, 0.1);
        }
        #startStopBtn.running {
            background-color: #FF5050;
            border-color: #FF8080;
            color: #FFFFFF;
        }
        #progressBar {
            background-color: #404040;
        }
        #progress {
            background-color: #6060FF;
        }
        #dlText {
            color: #AAAAFF;
        }
        #ulText {
            color: #50C050;
        }
        #pingText, #jitText {
            color: #FF8080;
        }
        #ipArea {
            font-size: 1.2em;
            margin: 0.5em 0;
            text-align: left;
        }
        #ipLine1 {
            margin-bottom: 0.5em;
        }
        #ipLine2 {
            font-size: 0.9em;
            color: #404040;
        }
        #ipLine2 strong {
            color: #6060AA;
        }
    }

</style>
</head>
<body>
<h1>Speedtest-X</h1>
<div id="startStopBtn" onclick="startStop()"></div>
<div id="test">
    <div id="progressBar"><div id="progress"></div></div>
	<div class="testGroup">
		<div class="testArea">
			<div class="testName">下载速度</div>
			<div id="dlText" class="meterText"></div>
			<div class="unit">Mbps</div>
		</div>
		<div class="testArea">
			<div class="testName">上传速度</div>
			<div id="ulText" class="meterText"></div>
			<div class="unit">Mbps</div>
		</div>
	</div>
	<div class="testGroup">
		<div class="testArea">
			<div class="testName">延迟</div>
			<div id="pingText" class="meterText"></div>
			<div class="unit">ms</div>
		</div>
		<div class="testArea">
			<div class="testName">抖动</div>
			<div id="jitText" class="meterText"></div>
			<div class="unit">ms</div>
		</div>
	</div>
	<div id="ipArea">
		<div id="ipLine1">IP地址: <span id="ip"></span></div>
		<div id="ipLine2"></div>
	</div>
</div>
<p><a href="./results.html" target="_blank">查看测速记录</a></p>
<p><a href="https://github.com/BadApple9/speedtest-x" target="_blank">speedtest-x 项目地址</a></p>
<script type="text/javascript">
    initUI();
</script>
</body>
</html>
