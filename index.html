<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no" />
<title>speedtest-x</title>
<link rel="shortcut icon" href="favicon.ico">
<script type="text/javascript" src="speedtest.js"></script>
<script type="text/javascript">
// INITIALIZE SPEEDTEST
var s = new Speedtest();
var xhr = new XMLHttpRequest();
var url_report = './backend/report.php';
var milestone = 0;
var key_prefix = Date.parse(new Date());

// 全局 IP 及位置信息对象
var ipGeoData = {
    ip: '',
    country: '',
    region: '',
    city: '',
    area: '',
    isp: ''
};

// 补全 renderIpInfo 函数声明，解决 ReferenceError
function renderIpInfo(data) {
    // 寻找页面渲染 IP 的容器元素，兼容原版 id="ip" 或 class/innerHTML 挂载
    var container = document.getElementById('ip');
    if (!container) {
        // 如果页面原本是用其他容器展示，尝试动态获取
        container = document.querySelector('.ip-info') || document.body;
    }

    if (data.is_ipv6) {
        // IPv6 多字段居中排版
        var countryStr = data.country_code ? (data.country + ' (' + data.country_code + ')') : data.country;
        var regionStr  = data.region_code ? (data.region + ' (' + data.region_code + ')') : data.region;

        container.innerHTML = 
            '<div style="text-align: center; line-height: 1.8; font-size: 14px; margin-top: 10px;">' +
                '<div><strong>IP地址</strong>: ' + (data.ip || '-') + '</div>' +
                '<div><strong>运营商</strong>: ' + (data.isp || '-') + ' &nbsp;&nbsp;&nbsp;&nbsp; <strong>组织</strong>: ' + (data.organization || '-') + '</div>' +
                '<div><strong>自治系统 (ASN)</strong>: ' + (data.asn || '-') + ' &nbsp;&nbsp;&nbsp;&nbsp; <strong>ASN组织</strong>: ' + (data.asn_organization || '-') + '</div>' +
                '<div><strong>大洲代码</strong>: ' + (data.continent_code || '-') + '</div>' +
                '<div><strong>国家</strong>: ' + countryStr + ' &nbsp;&nbsp;&nbsp;&nbsp; <strong>省份</strong>: ' + regionStr + '</div>' +
                '<div><strong>城市</strong>: ' + (data.city || '-') + ' &nbsp;&nbsp;&nbsp;&nbsp; <strong>邮编</strong>: ' + (data.postal_code || '-') + '</div>' +
                '<div><strong>时区</strong>: ' + (data.timezone || '-') + '</div>' +
                '<div><strong>经纬度</strong>: ' + (data.lat_lon || '-') + '</div>' +
            '</div>';
    } else {
        // IPv4 本地离线库基础排版
        container.innerHTML = 
            '<div style="text-align: center; line-height: 1.8; font-size: 14px; margin-top: 10px;">' +
                '<div><strong>IP地址</strong>: ' + (data.ip || '-') + '</div>' +
                '<div><strong>国家</strong>: ' + (data.country || '-') + ' &nbsp;&nbsp;&nbsp;&nbsp; <strong>省份</strong>: ' + (data.region || '-') + '</div>' +
                '<div><strong>城市</strong>: ' + (data.city || '-') + ' &nbsp;&nbsp;&nbsp;&nbsp; <strong>区县</strong>: ' + (data.area || '-') + '</div>' +
                '<div><strong>运营商</strong>: ' + (data.isp || '-') + '</div>' +
            '</div>';
    }
}

function fetchIPInfo() {
    var getIpXhr = new XMLHttpRequest();
    getIpXhr.open('GET', './backend/getIP.php', true);
    getIpXhr.onload = function() {
        if (getIpXhr.status === 200) {
            try {
                var res = JSON.parse(getIpXhr.responseText);
                if (res) {
                    ipGeoData.ip = res.ip || '';
                    ipGeoData.country = res.country || '';
                    ipGeoData.region = res.region || '';
                    ipGeoData.city = res.city || '';
                    ipGeoData.area = res.area || '';
                    ipGeoData.isp = res.isp || '';
                    
                    // 拿到数据后立即渲染更新页面
                    renderIPInfo();
                }
            } catch (e) {
                console.error("IP解析失败", e);
            }
        }
    };
    getIpXhr.send();
}

// 页面加载完成后立即发起 IP 获取
fetchIPInfo();

s.onupdate = function(data) {
    I("dlText").textContent = (data.testState == 1 && data.dlStatus == 0) ? "..." : data.dlStatus;
    I("ulText").textContent = (data.testState == 3 && data.ulStatus == 0) ? "..." : data.ulStatus;
    I("pingText").textContent = data.pingStatus;
    I("jitText").textContent = data.jitterStatus;
    
    var prog = (Number(data.dlProgress) * 2 + Number(data.ulProgress) * 2 + Number(data.pingProgress)) / 5;
    I("progress").style.width = (100 * prog) + "%";

    // 每次 update 刷新渲染文本
    renderIPInfo();

    var progress = Math.floor(100 * prog);
    var key = key_prefix + "_" + (ipGeoData.ip || '127.0.0.1');

    if (progress > 20 && (progress % 10 == 0) && progress != milestone) {
        var addr = [ipGeoData.country, ipGeoData.region, ipGeoData.city, ipGeoData.area].filter(Boolean).join(' ');
        var params = 'key=' + key + 
                     '&ip=' + encodeURIComponent(ipGeoData.ip) + 
                     '&isp=' + encodeURIComponent(ipGeoData.isp) + 
                     '&addr=' + encodeURIComponent(addr) + 
                     '&dspeed=' + I("dlText").textContent + 
                     '&uspeed=' + I("ulText").textContent + 
                     '&ping=' + I("pingText").textContent + 
                     '&jitter=' + I("jitText").textContent;

        xhr.timeout = 3000;
        xhr.open('POST', url_report, true);
        xhr.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
        xhr.send(params);
        milestone = progress;
    }
}

s.onend = function(aborted) {
    I("startStopBtn").className = "";
    if (aborted) {
        initUI();
    }
}

function startStop() {
    if (s.getState() == 3) {
        s.abort();
    } else {
        s.start();
        I("startStopBtn").className = "running";
    }
}

function initUI() {
    I("dlText").textContent = "";
    I("ulText").textContent = "";
    I("pingText").textContent = "";
    I("jitText").textContent = "";
}

function I(id) { return document.getElementById(id); }
</script>

<style type="text/css">
	html,body{
		border:none; padding:0; margin:0;
		background:#FFFFFF;
		color:#202020;
	}
	body{
		text-align:center;
		font-family:"Roboto",sans-serif;
	}
	h1{
		color:#404040;
	}
	#startStopBtn{
		display:inline-block;
		margin:0 auto;
		color:#6060AA;
		background-color:rgba(0,0,0,0);
		border:0.15em solid #6060FF;
		border-radius:0.3em;
		transition:all 0.3s;
		box-sizing:border-box;
		width:8em; height:3em;
		line-height:2.7em;
		cursor:pointer;
		box-shadow: 0 0 0 rgba(0,0,0,0.1), inset 0 0 0 rgba(0,0,0,0.1);
	}
	#startStopBtn:hover{
		box-shadow: 0 0 2em rgba(0,0,0,0.1), inset 0 0 1em rgba(0,0,0,0.1);
	}
	#startStopBtn.running{
		background-color:#FF3030;
		border-color:#FF6060;
		color:#FFFFFF;
	}
	#startStopBtn:before{
		content:"Start";
	}
	#startStopBtn.running:before{
		content:"Abort";
	}
	#test{
		margin-top:2em;
		margin-bottom:12em;
	}
	div.testArea{
		display:inline-block;
		width:14em;
		height:9em;
		position:relative;
		box-sizing:border-box;
	}
	div.testName{
		position:absolute;
		top:0.1em; left:0;
		width:100%;
		font-size:1.4em;
		z-index:9;
	}
	div.meterText{
		position:absolute;
		bottom:1.5em; left:0;
		width:100%;
		font-size:2.5em;
		z-index:9;
	}
	#dlText{
		color:#6060AA;
	}
	#ulText{
		color:#309030;
	}
	#pingText,#jitText{
		color:#AA6060;
	}
	div.meterText:empty:before{
		color:#505050 !important;
		content:"0.00";
	}
	div.unit{
		position:absolute;
		bottom:2em; left:0;
		width:100%;
		z-index:9;
	}
	div.testGroup{
		display:inline-block;
	}
	@media all and (max-width:65em){
		body{
			font-size:1.5vw;
		}
	}
	@media all and (max-width:40em){
		body{
			font-size:0.8em;
		}
		div.testGroup{
			display:block;
			margin: 0 auto;
		}
	}
	#progressBar{
		width:90%;
		height:0.3em;
		background-color:#EEEEEE;
		position:relative;
		display:block;
		margin:0 auto;
		margin-bottom:2em;
	}
	#progress{
		position:absolute;
		top:0; left:0;
		height:100%;
		width:0%;
		transition: width 2s;
		background-color:#90BBFF;
	}

	@media (prefers-color-scheme: dark) {
        html, body {
            background: #181818;
            color: #E0E0E0;
        }
        h1 {
            color: #FFFFFF;
        }
        #startStopBtn {
            color: #AAAAFF;
            border-color: #AAAAFF;
        }
        #startStopBtn:hover {
            box-shadow: 0 0 2em rgba(255, 255, 255, 0.1), inset 0 0 1em rgba(255, 255, 255, 0.1);
        }
        #startStopBtn.running {
            background-color: #FF5050;
            border-color: #FF8080;
            color: #FFFFFF;
        }
        #progressBar {
            background-color: #404040;
        }
        #progress {
            background-color: #6060FF;
        }
        #dlText {
            color: #AAAAFF;
        }
        #ulText {
            color: #50C050;
        }
        #pingText, #jitText {
            color: #FF8080;
        }
        #ipArea {
            font-size: 1.2em;
            margin: 0.5em 0;
            text-align: left;
        }
        #ipLine1 {
            margin-bottom: 0.5em;
        }
        #ipLine2 {
            font-size: 0.9em;
            color: #404040;
        }
        #ipLine2 strong {
            color: #6060AA;
        }
    }

</style>
</head>
<body>
<h1>Speedtest-X</h1>
<div id="startStopBtn" onclick="startStop()"></div>
<div id="test">
    <div id="progressBar"><div id="progress"></div></div>
	<div class="testGroup">
		<div class="testArea">
			<div class="testName">下载速度</div>
			<div id="dlText" class="meterText"></div>
			<div class="unit">Mbps</div>
		</div>
		<div class="testArea">
			<div class="testName">上传速度</div>
			<div id="ulText" class="meterText"></div>
			<div class="unit">Mbps</div>
		</div>
	</div>
	<div class="testGroup">
		<div class="testArea">
			<div class="testName">延迟</div>
			<div id="pingText" class="meterText"></div>
			<div class="unit">ms</div>
		</div>
		<div class="testArea">
			<div class="testName">抖动</div>
			<div id="jitText" class="meterText"></div>
			<div class="unit">ms</div>
		</div>
	</div>
	<div id="ipArea">
		<div id="ipLine1">IP地址: <span id="ip"></span></div>
		<div id="ipLine2"></div>
	</div>
</div>
<p><a href="./results.html" target="_blank">查看测速记录</a></p>
<p><a href="https://github.com/BadApple9/speedtest-x" target="_blank">speedtest-x 项目地址</a></p>
<script type="text/javascript">
    initUI();
</script>
</body>
</html>
