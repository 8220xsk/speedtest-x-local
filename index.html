<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no" />
<title>speedtest-x</title>
<link rel="shortcut icon" href="favicon.ico">
<script type="text/javascript" src="speedtest.js"></script>
<script type="text/javascript">
// INITIALIZE SPEEDTEST
var s = new Speedtest();
var xhr = new XMLHttpRequest();
var url_report = './backend/report.php';
var milestone = 0;
var key_prefix = Date.parse(new Date());

// 全局 IP 及位置信息对象；source: ''=未取得 | 'ip.sb'=精细 | 'local'=本地基础 | 'unavailable'=ip.sb 无响应(不渲染)
var ipGeoData = {
    source: '',
    ip: '',
    country: '',
    region: '',
    city: '',
    area: '',
    isp: ''
};
// ip.sb 是否已成功返回；是否已强制切到本地（用于拦截迟到的 ip.sb 响应）
var ipSbOk = false;
var forceLocal = false;

function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function(c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
}

function renderIPInfo() {
    var container = document.getElementById('ip');
    if (!container) {
        container = document.querySelector('.ip-info') || document.body;
    }

    // 无可用数据（ip.sb 未成功、尚未获取）时保持空白，不显示占位
    if (!ipGeoData.source || ipGeoData.source === 'unavailable') return;

    // 除局域网(本地基础版)外，IP.SB 成功即优先渲染多字段精细排版
    if (ipGeoData.source === 'ip.sb') {
        var countryStr = ipGeoData.country_code ? (ipGeoData.country + ' (' + ipGeoData.country_code + ')') : (ipGeoData.country || '-');
        var regionStr  = ipGeoData.region_code ? (ipGeoData.region + ' (' + ipGeoData.region_code + ')') : (ipGeoData.region || '-');

        container.innerHTML =
            '<div style="text-align: center; line-height: 1.8; font-size: 14px; margin-top: 10px;">' +
                '<div><strong>IP地址</strong>: ' + esc(ipGeoData.ip || '-') + '</div>' +
                '<div><strong>运营商</strong>: ' + esc(ipGeoData.isp || '-') + ' &nbsp;&nbsp;&nbsp;&nbsp; <strong>组织</strong>: ' + esc(ipGeoData.organization || '-') + '</div>' +
                '<div><strong>自治系统 (ASN)</strong>: ' + esc(ipGeoData.asn || '-') + ' &nbsp;&nbsp;&nbsp;&nbsp; <strong>大洲代码</strong>: ' + esc(ipGeoData.continent_code || '-') + '</div>' +
                '<div><strong>ASN组织</strong>: ' + esc(ipGeoData.asn_organization || '-') + '</div>' +
                '<div><strong>国家</strong>: ' + esc(countryStr) + ' &nbsp;&nbsp;&nbsp;&nbsp; <strong>省份</strong>: ' + esc(regionStr) + '</div>' +
                '<div><strong>城市</strong>: ' + esc(ipGeoData.city || '-') + ' &nbsp;&nbsp;&nbsp;&nbsp; <strong>邮编</strong>: ' + esc(ipGeoData.postal_code || '-') + '</div>' +
                '<div><strong>时区</strong>: ' + esc(ipGeoData.timezone || '-') + '</div>' +
                '<div><strong>经纬度</strong>: ' + esc(ipGeoData.lat_lon || '-') + '</div>' +
            '</div>';
    } else {
        // 局域网 / 本地离线库基础排版
        container.innerHTML =
            '<div style="text-align: center; line-height: 1.8; font-size: 14px; margin-top: 10px;">' +
                '<div><strong>IP地址</strong>: ' + esc(ipGeoData.ip || '-') + '</div>' +
                '<div><strong>国家</strong>: ' + esc(ipGeoData.country || '-') + ' &nbsp;&nbsp;&nbsp;&nbsp; <strong>省份</strong>: ' + esc(ipGeoData.region || '-') + '</div>' +
                '<div><strong>城市</strong>: ' + esc(ipGeoData.city || '-') + ' &nbsp;&nbsp;&nbsp;&nbsp; <strong>区县</strong>: ' + esc(ipGeoData.area || '-') + '</div>' +
                '<div><strong>运营商</strong>: ' + esc(ipGeoData.isp || '-') + '</div>' +
            '</div>';
    }
}

// 兼容别名
var renderIpInfo = renderIPInfo;

function fetchIPInfo(source) {
    var getIpXhr = new XMLHttpRequest();
    var url = './backend/getIP.php' + (source ? '?source=' + encodeURIComponent(source) : '');
    getIpXhr.open('GET', url, true);
    getIpXhr.timeout = 8000;

    // 强制本地请求失败时解除锁，允许下一次点击测速重试
    function unlockOnFail() {
        if (source === 'local') forceLocal = false;
    }

    getIpXhr.onload = function() {
        if (getIpXhr.status !== 200) { unlockOnFail(); return; }

        var res;
        try { res = JSON.parse(getIpXhr.responseText); } catch (e) { unlockOnFail(); return; }
        if (!res || !res.source) { unlockOnFail(); return; }

        // ip.sb 未响应：不写入任何字段、不渲染（保持空白），等点击测速再回退本地
        if (res.source === 'unavailable') return;
        // 已强制切本地后，丢弃迟到的 auto 响应（ip.sb 成功或超时结果都忽略）
        if (forceLocal && res.source !== 'local') return;

        // —— 到这里才允许写入全局数据 ——
        ipGeoData.source           = res.source;
        ipGeoData.is_ipv6          = res.is_ipv6 || false;
        ipGeoData.ip               = res.ip || '';
        ipGeoData.isp              = res.isp || '';
        ipGeoData.organization     = res.organization || '';
        ipGeoData.asn              = res.asn || '';
        ipGeoData.asn_organization = res.asn_organization || '';
        ipGeoData.continent_code   = res.continent_code || '';
        ipGeoData.country          = res.country || '';
        ipGeoData.country_code     = res.country_code || '';
        ipGeoData.region           = res.region || '';
        ipGeoData.region_code      = res.region_code || '';
        ipGeoData.city             = res.city || '';
        ipGeoData.area             = res.area || '';
        ipGeoData.postal_code      = res.postal_code || '';
        ipGeoData.timezone         = res.timezone || '';
        ipGeoData.lat_lon          = res.lat_lon || '';

        if (res.source === 'ip.sb') {
            ipSbOk = true;
            forceLocal = false;
        } else if (res.source === 'local') {
            ipSbOk = false;
        }

        renderIPInfo();
    };
    getIpXhr.onerror = getIpXhr.ontimeout = unlockOnFail;

    getIpXhr.send();
}

// 页面加载完成后立即发起 IP 获取
fetchIPInfo();

s.onupdate = function(data) {
    I("dlText").textContent = (data.testState == 1 && data.dlStatus == 0) ? "..." : data.dlStatus;
    I("ulText").textContent = (data.testState == 3 && data.ulStatus == 0) ? "..." : data.ulStatus;
    I("pingText").textContent = data.pingStatus;
    I("jitText").textContent = data.jitterStatus;
    
    var prog = (Number(data.dlProgress) * 2 + Number(data.ulProgress) * 2 + Number(data.pingProgress)) / 5;
    I("progress").style.width = (100 * prog) + "%";

    // 每次 update 刷新渲染文本
    renderIPInfo();

    var progress = Math.floor(100 * prog);
    var key = key_prefix + "_" + (ipGeoData.ip || '127.0.0.1');

    // ipGeoData.source 为空说明位置信息尚未取得（ip.sb 未决/未响应且本地未填充），本 tick 不上报，
    // 避免写入空白行；数据就绪后下一个 %10 tick 会正常上报
    if (progress > 20 && (progress % 10 == 0) && progress != milestone && ipGeoData.source) {
        var addr = [ipGeoData.country, ipGeoData.region, ipGeoData.city, ipGeoData.area].filter(Boolean).join(' ');
        var params = 'key=' + key +
                     '&ip=' + encodeURIComponent(ipGeoData.ip) +
                     '&isp=' + encodeURIComponent(ipGeoData.isp) +
                     '&country=' + encodeURIComponent(ipGeoData.country) +
                     '&region=' + encodeURIComponent(ipGeoData.region) +
                     '&city=' + encodeURIComponent(ipGeoData.city) +
                     '&area=' + encodeURIComponent(ipGeoData.area) +
                     '&addr=' + encodeURIComponent(addr) +
                     '&lat_lon=' + encodeURIComponent(ipGeoData.lat_lon) +
                     '&dspeed=' + I("dlText").textContent +
                     '&uspeed=' + I("ulText").textContent +
                     '&ping=' + I("pingText").textContent +
                     '&jitter=' + I("jitText").textContent;

        xhr.timeout = 3000;
        xhr.open('POST', url_report, true);
        xhr.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
        xhr.send(params);
        milestone = progress;
    }
}

s.onend = function(aborted) {
    I("startStopBtn").className = "";
    if (aborted) {
        initUI();
    }
}

function startStop() {
    if (s.getState() == 3) {
        s.abort();
    } else {
        // ip.sb 尚未成功时（且当前不是内网已有的本地数据）：点击测速即回退本地基础版（仅触发一次）
        if (!ipSbOk && ipGeoData.source !== 'local' && !forceLocal) {
            forceLocal = true;
            fetchIPInfo('local'); // 异步，不阻塞测速开始
        }
        s.start();
        I("startStopBtn").className = "running";
    }
}

function initUI() {
    I("dlText").textContent = "";
    I("ulText").textContent = "";
    I("pingText").textContent = "";
    I("jitText").textContent = "";
}

function I(id) { return document.getElementById(id); }
</script>

<style type="text/css">
	html,body{
		border:none; padding:0; margin:0;
		background:#FFFFFF;
		color:#202020;
	}
	body{
		text-align:center;
		font-family:"Roboto",sans-serif;
	}
	h1{
		color:#404040;
	}
	#startStopBtn{
		display:inline-block;
		margin:0 auto;
		color:#6060AA;
		background-color:rgba(0,0,0,0);
		border:0.15em solid #6060FF;
		border-radius:0.3em;
		transition:all 0.3s;
		box-sizing:border-box;
		width:8em; height:3em;
		line-height:2.7em;
		cursor:pointer;
		box-shadow: 0 0 0 rgba(0,0,0,0.1), inset 0 0 0 rgba(0,0,0,0.1);
	}
	#startStopBtn:hover{
		box-shadow: 0 0 2em rgba(0,0,0,0.1), inset 0 0 1em rgba(0,0,0,0.1);
	}
	#startStopBtn.running{
		background-color:#FF3030;
		border-color:#FF6060;
		color:#FFFFFF;
	}
	#startStopBtn:before{
		content:"Start";
	}
	#startStopBtn.running:before{
		content:"Abort";
	}
	#test{
		margin-top:2em;
		margin-bottom:12em;
	}
	div.testArea{
		display:inline-block;
		width:14em;
		height:9em;
		position:relative;
		box-sizing:border-box;
	}
	div.testName{
		position:absolute;
		top:0.1em; left:0;
		width:100%;
		font-size:1.4em;
		z-index:9;
	}
	div.meterText{
		position:absolute;
		bottom:1.5em; left:0;
		width:100%;
		font-size:2.5em;
		z-index:9;
	}
	#dlText{
		color:#6060AA;
	}
	#ulText{
		color:#309030;
	}
	#pingText,#jitText{
		color:#AA6060;
	}
	div.meterText:empty:before{
		color:#505050 !important;
		content:"0.00";
	}
	div.unit{
		position:absolute;
		bottom:2em; left:0;
		width:100%;
		z-index:9;
	}
	div.testGroup{
		display:inline-block;
	}
	@media all and (max-width:65em){
		body{
			font-size:1.5vw;
		}
	}
	@media all and (max-width:40em){
		body{
			font-size:0.8em;
		}
		div.testGroup{
			display:block;
			margin: 0 auto;
		}
	}
	#progressBar{
		width:90%;
		height:0.3em;
		background-color:#EEEEEE;
		position:relative;
		display:block;
		margin:0 auto;
		margin-bottom:2em;
	}
	#progress{
		position:absolute;
		top:0; left:0;
		height:100%;
		width:0%;
		transition: width 2s;
		background-color:#90BBFF;
	}

	@media (prefers-color-scheme: dark) {
        html, body {
            background: #181818;
            color: #E0E0E0;
        }
        h1 {
            color: #FFFFFF;
        }
        #startStopBtn {
            color: #AAAAFF;
            border-color: #AAAAFF;
        }
        #startStopBtn:hover {
            box-shadow: 0 0 2em rgba(255, 255, 255, 0.1), inset 0 0 1em rgba(255, 255, 255, 0.1);
        }
        #startStopBtn.running {
            background-color: #FF5050;
            border-color: #FF8080;
            color: #FFFFFF;
        }
        #progressBar {
            background-color: #404040;
        }
        #progress {
            background-color: #6060FF;
        }
        #dlText {
            color: #AAAAFF;
        }
        #ulText {
            color: #50C050;
        }
        #pingText, #jitText {
            color: #FF8080;
        }
        #ipArea {
            font-size: 1.2em;
            margin: 0.5em 0;
            text-align: left;
        }
        #ipLine1 {
            margin-bottom: 0.5em;
        }
        #ipLine2 {
            font-size: 0.9em;
            color: #404040;
        }
        #ipLine2 strong {
            color: #6060AA;
        }
    }

</style>
</head>
<body>
<h1>Speedtest-X</h1>
<div id="startStopBtn" onclick="startStop()"></div>
<div id="test">
    <div id="progressBar"><div id="progress"></div></div>
	<div class="testGroup">
		<div class="testArea">
			<div class="testName">下载速度</div>
			<div id="dlText" class="meterText"></div>
			<div class="unit">Mbps</div>
		</div>
		<div class="testArea">
			<div class="testName">上传速度</div>
			<div id="ulText" class="meterText"></div>
			<div class="unit">Mbps</div>
		</div>
	</div>
	<div class="testGroup">
		<div class="testArea">
			<div class="testName">延迟</div>
			<div id="pingText" class="meterText"></div>
			<div class="unit">ms</div>
		</div>
		<div class="testArea">
			<div class="testName">抖动</div>
			<div id="jitText" class="meterText"></div>
			<div class="unit">ms</div>
		</div>
	</div>
	<div id="ipArea">
		<div id="ipLine1"><div id="ip"></div></div>
		<div id="ipLine2"></div>
	</div>
</div>
<p><a href="./results.html" target="_blank">查看测速记录</a></p>
<p><a href="https://github.com/BadApple9/speedtest-x" target="_blank">speedtest-x 项目地址</a></p>
<script type="text/javascript">
    initUI();
</script>
</body>
</html>
